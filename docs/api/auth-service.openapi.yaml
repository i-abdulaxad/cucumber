      operationId: createProject
      summary: Create a project
      description: |
        Organization `OWNER` or `ADMIN` (otherwise 403 `FORBIDDEN`, AC-1.2). The caller is implicit project `ADMIN`, so
        `myRole` is `ADMIN` and the new project has no explicit members (AC-1.1). The name is stored trimmed (AC-1.8)
        and must be unique in the organization, archived projects included, compared after trimming and lower-casing
        (409 `PROJECT_NAME_TAKEN`, AC-1.4); another organization may use the same name (AC-1.5). An unknown
        organization and one the caller doesn't belong to both get 403 `FORBIDDEN` (AC-1.6). Of simultaneous creations
        with one name, exactly one succeeds and every other one gets 409 `PROJECT_NAME_TAKEN` (AC-1.7).

        **Which error wins:** request validation (400, AC-1.3); then 403 `FORBIDDEN`; then 409 `PROJECT_NAME_TAKEN`.
      parameters:
