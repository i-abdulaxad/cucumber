      operationId: changeProjectMemberRole
      summary: Change a project member's role
      description: |
        Effective project `ADMIN` (otherwise 403 `FORBIDDEN`, AC-5.1). The target must be an explicit member of the
        project; an implicit admin without a membership, a non-member and an unknown id get 404 `MEMBER_NOT_FOUND`
