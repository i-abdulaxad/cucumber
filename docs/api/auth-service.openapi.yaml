      operationId: addProjectMember
      summary: Add an organization member to the project
      description: |
        Effective project `ADMIN` (otherwise 403 `FORBIDDEN`, AC-4.3). The user must be a current member of the
        project's organization: a non-member and an unknown user id both get 422 `NOT_ORG_MEMBER` (AC-4.4). The user
        must not already be an explicit member (409 `ALREADY_MEMBER`, AC-4.5), and `role` must be within the cap of
        their organization role: an organization `READER` can only be a project `READER` (422
        `PROJECT_ROLE_NOT_ALLOWED`, AC-4.6). The new member has access at once, with the token they already hold
        (AC-4.2). It uses no organization seat (AC-4.8). An implicit admin can also be added explicitly and keeps
        effective `ADMIN` (AC-4.9). An archived project can't change (409 `PROJECT_ARCHIVED`, AC-3.6). Of two
        simultaneous adds of one user, one succeeds and the other gets 409 `ALREADY_MEMBER`, never a 500.

        A missing `userId` or `role` is 400 `VALIDATION_FAILED`; an unknown `role` (including `OWNER`), a `role` sent as
        a number, or a `userId` that isn't a UUID is 400 `MALFORMED_REQUEST` (AC-4.7).

        **Which error wins (D6):** request validation (400); then 403 `FORBIDDEN`; then 409 `PROJECT_ARCHIVED`; then 422
        `NOT_ORG_MEMBER`; then 409 `ALREADY_MEMBER`; then 422 `PROJECT_ROLE_NOT_ALLOWED`.
