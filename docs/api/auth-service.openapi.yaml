  /api/orgs/{orgId}/invitations:
    post:
      tags:
        - Invitations
      operationId: createInvitation
      summary: Invite someone by email
      description: |
        At least `ADMIN` in the organization (otherwise 403 `FORBIDDEN`), and `role` within the caller's own rank
        (otherwise 422 `ROLE_CEILING`): an `ADMIN` can't invite an `OWNER`; an `OWNER` can invite any role (AC-5.2).

        - The email is normalised (D12). No email is sent in phase 1: the response returns the acceptance `token`
          **once**, to the inviter, who shares it out of band. It is never listed and never logged (AC-5.1).
        - The invitation is `PENDING` and expires 7 days after `createdAt`.
        - 409 `SEAT_LIMIT_REACHED` when seats used (members + pending unexpired invitations) already equal the seat
          limit (AC-5.3). An expired invitation doesn't use a seat (AC-5.4).
        - 409 `ALREADY_MEMBER` when the email belongs to a member (AC-5.5); 409 `INVITATION_PENDING` when a pending,
          unexpired invitation for that email already exists in the organization (AC-5.6).
        - An unknown `role` value is 400 `MALFORMED_REQUEST`; a missing or invalid field is 400 `VALIDATION_FAILED`
          (AC-5.7). A `role` sent as a number or a string of digits (`0`, `"3"`) is 400 `MALFORMED_REQUEST` (AC-5.11).
        - Two concurrent invitations for the last seat can't both succeed: one gets 409 `SEAT_LIMIT_REACHED`.

        **Which error wins (Q6):** request validation (400, before authorization, A3); then 403 `FORBIDDEN` (not a
        member, or below `ADMIN`); then 422 `ROLE_CEILING`; then 409 `ALREADY_MEMBER`; then 409 `INVITATION_PENDING`;
        then 409 `SEAT_LIMIT_REACHED`.
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteMemberRequest'
            example:
              email: Fay@Example.com
              role: MEMBER
      responses:
        '201':
          description: Invitation created. The only response that ever contains the acceptance token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedInvitation'
              example:
                id: 2c7e9f10-4b3a-4d8e-a1f6-5e0d3c9b8a72
                email: fay@example.com
                role: MEMBER
                status: PENDING
                createdAt: '2026-10-12T09:30:00.123456Z'
                expiresAt: '2026-10-19T09:30:00.123456Z'
                token: q3Xb0v6m1T2cJw8Hk4Zr9Ya5Lp7Nd0Es
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          description: |
            `SEAT_LIMIT_REACHED`, `ALREADY_MEMBER`, `INVITATION_PENDING`, or `CONFLICT` for a concurrent change or a lock
            that couldn't be acquired in time (AC-1.9).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Conflict
                status: 409
                detail: The organization has no free seat.
                instance: /api/orgs/0b8e4a52-6c1f-4f0e-8d3a-7a2b9c1d5e60/invitations
                code: SEAT_LIMIT_REACHED
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/RoleCeiling'
        4XX:
          $ref: '#/components/responses/OtherClientError'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    get:
      tags:
        - Invitations
      operationId: listPendingInvitations
      summary: List pending invitations
      description: |
        At least `ADMIN` (otherwise 403 `FORBIDDEN`). Only `PENDING` invitations whose `expiresAt` is in the future,
        ordered by creation time. Items never contain the acceptance token (AC-5.8).
      parameters:
        - $ref: '#/components/parameters/OrgId'
