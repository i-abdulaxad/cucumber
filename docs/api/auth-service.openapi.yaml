  /api/orgs/{orgId}/invitations/{invitationId}:
    delete:
      tags:
        - Invitations
      operationId: revokeInvitation
      summary: Revoke a pending invitation
      description: |
        At least `ADMIN` (otherwise 403 `FORBIDDEN`). Sets the invitation to `REVOKED`: its seat is freed and its
        token stops working (accepting it then gives 410 `INVITATION_REVOKED`, AC-5.9). An unknown id, or an id that
        belongs to another organization, is 404 `INVITATION_NOT_FOUND`; an `ACCEPTED` or `REVOKED` invitation is 409
        `INVITATION_NOT_PENDING` (AC-5.10). A `PENDING` invitation whose `expiresAt` has passed can still be revoked:
        `204`, and it becomes `REVOKED` (Q4).

        **Role ceiling (AC-5.12):** the caller may revoke only invitations whose role ranks at most their own;
        otherwise 422 `ROLE_CEILING` and the invitation stays pending. So an `ADMIN` can't revoke an `OWNER`
        invitation, expired or not; an `OWNER` can revoke any invitation.

        **Which error wins (D13):** 403 `FORBIDDEN`; then 404 `INVITATION_NOT_FOUND`; then 409
        `INVITATION_NOT_PENDING`; then 422 `ROLE_CEILING`.
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: invitationId
          in: path
          required: true
          description: The invitation's `id`.
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '204':
          description: Revoked.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: '`INVITATION_NOT_FOUND`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: '`INVITATION_NOT_PENDING`, or `CONFLICT` when a lock couldn''t be acquired in time (AC-1.9).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/RoleCeiling'
        4XX:
          $ref: '#/components/responses/OtherClientError'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
