openapi: 3.1.0
info:
  title: auth-service API
  version: 1.4.0
  summary: Accounts, login, organizations, invitations, members, projects and the project access check.
  description: |
    Contract C1 of `docs/specs/auth-service.md` (phase 1) and contracts C1 and C5 of
    `docs/specs/auth-service-projects.md` (phase 2). It documents every operation, the error format (D2) and the token
    rules (C2). The paths, status codes and `code` values here come from the specs' acceptance criteria (AC-x.y) and
    are binding. Wording of `detail` and validation `message` texts is not part of the contract. Where an AC is cited
    without a spec, phase-1 operations refer to the phase-1 spec and project operations to the phase-2 spec.

    ## Changes in 1.4.0 (`docs/specs/platform-hardening.md`, 2026-10-26)

    Additive: no path, success response or existing `code` value changes.
    - **`SERVICE_UNAVAILABLE` (503)** (D7): when no database connection is available, every operation that uses the database answers 503
      with `code` `SERVICE_UNAVAILABLE`, detail "The service is temporarily unavailable. Try again later." and no
      `Retry-After` header. This includes login (never 401 `INVALID_CREDENTIALS`) and authenticated operations (never
      401 `UNAUTHENTICATED`), so clients must not treat it as "log in again"; a later retry can succeed. Other
      database errors keep their mapping (409 `CONFLICT` for locks and conflicts, 500 `INTERNAL_ERROR`).
    - **Problems before Spring MVC** (D3, D5): paths the security firewall rejects (for example containing `;`,
      `/./`, encoded `..` or `//`) are 400 `MALFORMED_REQUEST`, and `TRACE` is 405 `METHOD_NOT_ALLOWED`, as Problems
      with `code` and `requestId`. `instance` is the path as sent, omitted when it isn't a valid URI reference.
    - **A direct `/error` is an unrouted path** (D4): 401 `UNAUTHENTICATED` without a valid token, 404 `NOT_FOUND`
      with one.
    - The phase-1 deviation note (FU-1) is replaced by "Requests rejected before the application" below.

    ## Implementation status (1.4.0, review point A, 2026-10-26)

    Every 1.4.0 change is implemented as described, pending qa verification of platform-hardening.

    ## Changes in 1.3.0 (auth-service phase 4, `docs/specs/auth-service-persistence.md`, 2026-10-15)

    No path, operation or `code` value is added or removed, and existing success responses keep their fields. The
    timestamp format and the stricter input rules below are the only visible changes; the move to PostgreSQL with
    Flyway migrations is internal.
    - **Timestamps are UTC** (phase-4 D6, T5): every timestamp is an ISO-8601 instant with a `Z` offset and 0 to 6
      fraction digits, for example `2026-10-14T09:30:00.123456Z` (schema `Timestamp`, which replaces
      `LocalDateTime`). Timestamps now carry a `Z` offset. Clients that parsed offset-less strings must accept an
      offset. No client existed at the time of the change.
    - Names and emails that contain a control character or a lone surrogate are 400 `VALIDATION_FAILED` (phase-4 D11
      rule T1, T1); see the request field descriptions.
    - Names made only of whitespace or invisible format characters are blank, and the 100-character name limits count
      Unicode code points (phase-4 D11 rules T2 and T3, T11).
    - A JSON number or boolean where a string belongs is 400 `MALFORMED_REQUEST`, no longer coerced to text (phase-4
      D12, T12). `null` is unchanged: 400 `VALIDATION_FAILED`.
    - Path ids must be canonical UUIDs (36 characters, hexadecimal digits in groups of 8-4-4-4-12; upper-case digits
      are accepted and identify the same resource). Anything else, for example `1-1-1-1-1`, is 400
      `MALFORMED_REQUEST` before authorization (phase-4 D13, T13).

    ## Changes in 1.2.1 (phase-2 T11 and T16, 2026-10-13)

    Wording and error-list sync with the implementation; no path, schema or success response changes.
    - `CreateProjectRequest.name`: the 1–100 length is counted before trimming (phase-2 D5, Q3), so 100 characters with
      a surrounding space is 400 `VALIDATION_FAILED`.
    - `archiveProject` and `restoreProject` list 409 `CONFLICT`: like every project write, they take the organization
      lock and can answer it under heavy contention (AC-1.9).

    ## Changes in 1.2.0 (auth-service phase 2, task T8, 2026-10-13)

    Additive only: no phase-1 path, status code, `code` value or response shape changes.
    - Projects inside an organization: create, list, view, rename, archive and restore, under
      `/api/orgs/{orgId}/projects` (phase-2 US-1 to US-3).
    - Project members: list, add, change role, remove and leave (phase-2 US-4, US-5).
    - The project access check for other services, `GET /internal/projects/{projectId}/access` (phase-2 US-7,
      contract C5). It is service-to-service and never routed by the gateway.
    - Four new `code` values: `PROJECT_NAME_TAKEN` (409), `PROJECT_ARCHIVED` (409), `NOT_ORG_MEMBER` (422) and
      `PROJECT_ROLE_NOT_ALLOWED` (422) (phase-2 D14).
    - New schemas: `ProjectRole`, `Project`, `ProjectMember`, `ProjectAccess`, `CreateProjectRequest`,
      `RenameProjectRequest`, `AddProjectMemberRequest` and `ChangeProjectMemberRoleRequest`.
    - `OrganizationRole` now states that leading and trailing ASCII whitespace is ignored (phase-1 FU-7, BUG-6, Q9).
      That documents existing behaviour; `ProjectRole` gets the same wording.
    - Organization membership and role changes now carry through to projects (phase-2 US-6), as described under
      "Projects". The organization operations' paths, statuses and bodies don't change.

    ## Implementation status (1.3.0, review point E, 2026-10-15)

    Every operation in this file is implemented as described on PostgreSQL 17, including every 1.3.0 change,
    pending qa verification of phase 4.

    ## Implementation status (1.2.1, review point C, 2026-10-13)

    Every operation in this file is implemented as described, pending qa verification: phase 1, the access check
    (phase-2 T7), the project and project-member operations (T11–T14), and the carry-through of organization changes
    to projects (T15).

    ## Implementation status (review point C, 2026-10-12)

    Every operation in this file is implemented as described (T1–T14), pending qa verification. Version 1.0.0 is the
    phase-1 contract.

    ## Changes in 1.1.0 (fix round T16–T21, 2026-10-12, spec D13)

    None of these changes a success response. They make error answers more specific:
    - A lock that can't be acquired in time is 409 `CONFLICT`, no longer 500 `INTERNAL_ERROR` (AC-1.9).
    - A `role` sent as a number or as a string of digits (`0`, `1`, `"3"`) is 400 `MALFORMED_REQUEST`; it is never
      mapped by the enum's declaration order (AC-5.11, AC-7.8). Before, it was accepted.
    - A login password longer than 72 UTF-8 bytes is 401 `INVALID_CREDENTIALS`, with the same `detail` as any wrong
      password and no validation error (AC-2.10). Before, a 72-byte password with any suffix logged in.
    - The losers of simultaneous registrations of one email get 409 `EMAIL_ALREADY_REGISTERED`, like a late
      registration (AC-2.11). Before, they got 409 `CONFLICT`.
    - Revoking an invitation applies the role ceiling: 422 `ROLE_CEILING` when the invitation's role ranks above the
      caller's (AC-5.12). Before, an `ADMIN` could revoke an `OWNER` invitation (204).
    - An anonymous accept with no body, or with an empty body, lists `fullName` and `password` as separate `errors`
      entries, like `{}` (AC-6.10). Before, it had one entry whose `field` was `acceptInvitationRequest`.

    ## Requests rejected before the application (platform-hardening D6)

    Tomcat rejects some requests before any application code runs: an encoded slash (`%2F`) or `%00` in the path,
    raw characters such as `{` or `|`, the `CONNECT` method (501), a malformed request line, and an oversized URI or
    headers. These keep Tomcat's status (400, or 501 for `CONNECT`) with Tomcat's minimal body: no Problem, no `code`, no
    `X-Request-Id`, and nothing internal (no stack trace, no server version). This is permanent, not a phase-1
    deviation. Everything that reaches the application, including the security firewall's 400 and `TRACE`, is a
    Problem.

    ## Which error wins (Q6)

    When several errors apply, checks run in a fixed order and the first failure is returned. The descriptions of
    `createInvitation`, `acceptInvitation`, `changeMemberRole` and `removeMember`, and of every project operation
    that writes, list their order. Request-body validation (400) runs before authorization (403), so a caller who
    isn't allowed but sends an invalid body gets 400; nothing about the organization or project is revealed by it
    (phase-1 A3, phase-2 A3).

    ## Calling the service

    - Through the gateway: `http://localhost:8080` (normal use). External paths equal service paths; the gateway does
      no rewriting. Through the gateway, a missing or invalid token on a protected operation gets the **gateway's**
      401 Problem (it has `requestId` but no `code`), and the request never reaches auth-service.
    - Directly: `http://localhost:8081` (local development only). Swagger UI (`/swagger-ui/**`) and the runtime
      document (`/v3/api-docs`) are public here and are not routed by the gateway. This file, not `/v3/api-docs`, is
      the contract (D9).

    ## Authentication (D4, D7, C2)

    - Exactly three operations are public (`security: []`): `POST /api/auth/register`, `POST /api/auth/login` and
      `POST /api/auth/invitations/{token}/accept`. Every other path, including any unknown `/api/auth/...` path,
      `/h2-console` and `/actuator/**`, needs a valid token and otherwise gets 401 `UNAUTHENTICATED` (AC-3.6).
    - On a public operation an invalid, expired or unusable token is ignored and the caller is anonymous, so a user
      with an expired token can still log in (AC-2.8).
    - Every authenticated request loads the user from the database. A token whose user no longer exists (AC-3.5) or
      is `SUSPENDED` (AC-3.4) gets 401 `UNAUTHENTICATED`.
    - Users with status `PENDING_VERIFICATION` can log in and use the API in phase 1 (AC-2.7).

    ## Authorization (D3, D11)

    - Organization roles and their rank: `OWNER` 4 > `ADMIN` 3 > `MEMBER` 2 > `READER` 1. Project roles are described
      under "Projects".
    - The caller's role is read **from the database on every request**, never from the token's `orgs` claim, which
      is informational and stale until the next login. A role change or removal takes effect on the next request
      (AC-7.6, AC-8.2), and a new organization is usable with the token the creator already holds (AC-4.7).
    - A non-member and a non-existent organization get the same 403 `FORBIDDEN`, so organization ids can't be probed
      (AC-4.6).
    - **Role ceiling:** an actor may invite with, change to, or change or remove a member holding, only roles whose
      rank is at most the actor's own rank, and may revoke only invitations whose role rank is at most their own
      (422 `ROLE_CEILING`). An `OWNER` can do everything, including making another `OWNER`.
    - **Seats:** seats used = members + `PENDING` invitations whose `expiresAt` is in the future. `seatLimit: null`
      means unlimited. Organizations created in phase 1 are on plan `FREE` with seat limit 5 (setting
      `app.orgs.free-seat-limit`). Two concurrent requests for the last seat can't both succeed.

    ## Projects (phase 2: D3–D6, D9)

    A project belongs to exactly one organization. Its content (features, runs, results) lives in other services,
    which refer to it by `id`.

    - **Project roles and their rank:** `ADMIN` 4 > `MEMBER` 3 > `TESTER` 2 > `READER` 1. Compare project roles by
      rank only, never by string or declaration order. Each role includes the ones below it.
    - **Effective project role:** computed from the database on every request, never from the token:
      - not a member of the project's organization: none;
      - organization `OWNER` or `ADMIN`: `ADMIN` (implicit project admin, on every project of the organization,
        without a membership row);
      - otherwise the caller's explicit project role, or none.

      `myRole` in project responses and `role` in the access check are always the effective role. A change applies to
      the next request, whatever the caller's token says (AC-5.5, AC-5.8, AC-7.5). "Has access" means "has an
      effective project role".
    - **Project role cap:** an explicit membership's role is at most the cap of the member's organization role. An
      organization `READER` can only be a project `READER`; an organization `MEMBER`, `ADMIN` or `OWNER` can hold any
      project role (422 `PROJECT_ROLE_NOT_ALLOWED`).
    - **Who can do what:**

      | Operation | Allowed |
      |---|---|
      | Create a project | Organization `OWNER` or `ADMIN` |
      | List an organization's projects | Any organization member; lists only the projects the caller has access to |
      | View a project, list its members | Has access (any effective role) |
      | Rename, archive, restore | Effective project `ADMIN` |
      | Add a member, change a role, remove someone else | Effective project `ADMIN` |
      | Leave (remove yourself) | Any explicit member |
      | Access check | Has access |

    - **No probing:** no access, an unknown project, and a project of another organization (also a project id under
      the wrong `orgId` in the path) all get the same 403 `FORBIDDEN` (AC-2.3, AC-7.2).
    - **Names:** 1–100 characters and not blank, stored trimmed (AC-1.8). Unique per organization, archived projects
      included, compared after trimming and lower-casing (409 `PROJECT_NAME_TAKEN`, AC-1.4). The same name may exist
      in another organization (AC-1.5). Renaming a project to its own name in another letter case is allowed
      (AC-3.2).
    - **Archive:** sets `archivedAt`. An archived project stays visible and readable to everyone with access
      (AC-2.4, AC-3.5), but it is read-only: renaming and every membership change, leaving included, get 409
      `PROJECT_ARCHIVED` (AC-3.6). Restore clears `archivedAt`. Archive and restore are idempotent: 200 with the
      unchanged state (AC-3.8). Projects can't be deleted.
    - **Members:** only current members of the project's organization can be added, by user id, with a project role.
      There are no project invitations: invite to the organization first. A project membership uses no organization
      seat (AC-4.8). The member list shows explicit members only; implicit admins appear in it only if they also have
      an explicit membership, which they keep but which doesn't lower their effective role (AC-4.9).
    - **Organization changes carry through (US-6),** in the same transaction as the organization change:
      - a user who leaves or is removed from an organization loses every membership in its projects, so rejoining
        starts without project access (AC-6.1, AC-6.2);
      - a user whose organization role becomes `READER` has their explicit project roles above `READER` in that
        organization lowered to `READER` (AC-6.3); a later promotion doesn't restore them;
      - becoming organization `ADMIN` or `OWNER` gives implicit `ADMIN` on every project, and losing it removes that
        (AC-6.5, AC-6.6). Other organization role changes keep explicit project roles (AC-6.4).
    - **Order:** projects are listed by name (case-insensitive), then by id; project members by email.
    - **Concurrency:** of simultaneous creations with one name, exactly one succeeds and every other one gets 409
      `PROJECT_NAME_TAKEN` (AC-1.7). Two simultaneous adds of one user give one membership and one 409
      `ALREADY_MEMBER`, never a 500.

    ## Errors (D2)

    Every error auth-service produces is an RFC 9457 Problem (`application/problem+json`, schema `Problem`) with
    `type` `about:blank`, `title` (the HTTP reason phrase), `status`, a non-empty `detail`, `instance` (the request
    path without the query string) and the stable extension member `code`. Clients branch on `status` first and on
    `code` second. Validation Problems add `errors`. When the request carries an `X-Request-Id` header matching
    `^[A-Za-z0-9._-]{1,128}$` (the gateway always sends one), the body has `requestId` with that value; auth-service
    never sets an `X-Request-Id` response header. Bodies never contain stack traces, exception class names, SQL or
    internal hosts and ports.

    | Situation | Status | `code` |
    |---|---|---|
    | Bean Validation failure on a body or parameter | 400 | `VALIDATION_FAILED` (with `errors`) |
    | Unreadable JSON, a JSON number or boolean where a string belongs (phase-4 D12), a wrong enum value (including a number or a string of digits), a path id that isn't a canonical UUID (phase-4 D13) | 400 | `MALFORMED_REQUEST` |
    | No or invalid credentials on a protected operation | 401 | `UNAUTHENTICATED` |
    | Wrong email or password (including a password over 72 UTF-8 bytes), or a suspended account, at login | 401 | `INVALID_CREDENTIALS` |
    | Authenticated, but not allowed (not a member, role too low; for projects also no access, an unknown project, or a project of another organization) | 403 | `FORBIDDEN` |
    | Accepting an invitation addressed to another email | 403 | `INVITATION_EMAIL_MISMATCH` |
    | Unknown path | 404 | `NOT_FOUND` |
    | Invitation token or id unknown (or in another organization) | 404 | `INVITATION_NOT_FOUND` |
    | Target user isn't a member of the organization, or isn't an explicit member of the project | 404 | `MEMBER_NOT_FOUND` |
    | Method not supported | 405 | `METHOD_NOT_ALLOWED` |
    | No acceptable response media type for the `Accept` header | 406 | `NOT_ACCEPTABLE` |
    | Email already registered, also when another request registers it at the same moment | 409 | `EMAIL_ALREADY_REGISTERED` |
    | Invitee is already a member; or the user being added to a project is already an explicit member | 409 | `ALREADY_MEMBER` |
    | Another project in the organization already has that name (trimmed, case-insensitive, archived projects included) | 409 | `PROJECT_NAME_TAKEN` |
    | Renaming an archived project, or changing its members (leaving included) | 409 | `PROJECT_ARCHIVED` |
    | A pending, unexpired invitation already exists for that email | 409 | `INVITATION_PENDING` |
    | No free seat | 409 | `SEAT_LIMIT_REACHED` |
    | The last owner tries to leave | 409 | `LAST_OWNER` |
    | Revoking an invitation that isn't pending | 409 | `INVITATION_NOT_PENDING` |
    | Any other unique-constraint conflict | 409 | `CONFLICT` |
    | A lock that can't be acquired in time (another request is changing the same data) | 409 | `CONFLICT` |
    | Invitation expired / revoked / already accepted (on accept) | 410 | `INVITATION_EXPIRED` / `INVITATION_REVOKED` / `INVITATION_ALREADY_ACCEPTED` |
    | Unsupported `Content-Type` | 415 | `UNSUPPORTED_MEDIA_TYPE` |
    | Any other 4xx that Spring MVC raises itself and that no row above covers (for example a missing required parameter or header) | Spring's status, unchanged | `MALFORMED_REQUEST` |
    | Role above the actor's own rank (grant, change, remove, or revoke an invitation) | 422 | `ROLE_CEILING` |
    | Changing your own role (organization or project) | 422 | `SELF_ROLE_CHANGE` |
    | Adding a user to a project who isn't a member of the project's organization, or doesn't exist | 422 | `NOT_ORG_MEMBER` |
    | A project role above the cap of the member's organization role | 422 | `PROJECT_ROLE_NOT_ALLOWED` |
    | Anything unexpected | 500 | `INTERNAL_ERROR` |
    | No database connection available (any operation, including login) | 503 | `SERVICE_UNAVAILABLE` |

    - Acceptance criteria: validation errors list each invalid field (AC-1.1); an unreadable body is
      `MALFORMED_REQUEST`, also on public operations (AC-1.2); an unexpected failure reveals nothing internal and is
      logged once (AC-1.3); unknown paths (AC-1.4), unsupported methods (AC-1.5) and content types (AC-1.6) get their
      Problems; `requestId` follows the rule above (AC-1.7).
    - A lock that can't be acquired in time is 409 `CONFLICT`, logged at WARN without a stack trace, and the request
      changes nothing (AC-1.9). Any operation that writes can answer it under heavy contention; clients may retry.
    - On `acceptInvitation` errors, `instance` is the request path and so contains the acceptance token. It is the
      caller's own input, echoed only to that caller, and never logged (spec D13, Q3).
    - Every 401 (`UNAUTHENTICATED` and `INVALID_CREDENTIALS`) carries `WWW-Authenticate: Bearer` (RFC 9110 §15.5.2).
    - A 406 Problem is written as `application/problem+json` only when the request's `Accept` header allows that
      media type; otherwise the 406 body may be empty.
    - Unknown paths (404 `NOT_FOUND`) and unsupported methods on known paths (405 `METHOD_NOT_ALLOWED`, for example
      `DELETE /api/orgs` or `PUT /api/orgs/{orgId}`) apply to every path and are not repeated per operation.
    - Through the gateway, the gateway's own errors (401, 403 for CORS, 404 for unrouted paths, 502, 503, 504) have
      no `code`. Clients must handle a Problem without `code`.

    ## Headers and other rules (C4)

    - `Location` headers are relative (`/api/orgs/{id}`).
    - auth-service never emits CORS headers (`Access-Control-*`); the gateway is the CORS authority (AC-1.8).
    - Emails are trimmed and lower-cased before they are stored or compared (D12), at registration, login,
      invitation and acceptance. Validation runs on the raw input.
    - Timestamps (`createdAt`, `expiresAt`, `joinedAt`, `archivedAt`) are UTC instants: ISO-8601 with a `Z` offset and
      0 to 6 fraction digits (microseconds at most), for example `2026-10-14T09:30:00.123456Z` (phase-4 D6). The
      server's time zone never changes them.
    - Lists are not paginated in phase 1 or phase 2.
  x-spec: docs/specs/auth-service.md
  x-spec-projects: docs/specs/auth-service-projects.md
servers:
  - url: http://localhost:8080
    description: Through the API gateway (normal use).
  - url: http://localhost:8081
    description: Direct to auth-service (local development; Swagger UI and `/v3/api-docs` only here).
security:
  - bearerAuth: []
tags:
  - name: Accounts
    description: Registration and login (US-2).
  - name: Organizations
    description: Create, list and view organizations (US-4).
  - name: Invitations
    description: Invite, list and revoke (US-5); accept (US-6).
  - name: Members
    description: List members, change roles, remove and leave (US-7, US-8).
  - name: Projects
    description: Create, list, view, rename, archive and restore projects (phase-2 US-1 to US-3).
  - name: Project members
    description: List, add, change roles, remove and leave (phase-2 US-4, US-5).
  - name: Project access check
    description: |
      Service-to-service (phase-2 US-7, contract C5). Called by other services directly on auth-service's base URL,
      never through the gateway.
  - name: Tooling
    description: Development tooling on the service port only.
paths:
  /api/auth/register:
    post:
      tags:
        - Accounts
      operationId: register
      summary: Register a new account
      description: |
        Public. Creates an account with status `PENDING_VERIFICATION` and `mfaEnabled` false (AC-2.1). The email is
        normalised (trimmed, lower-cased) before it is stored, so `Ana@Example.COM` and `ana@example.com` are the same
        account (AC-2.2). The response never contains the password or its hash. Registration does not log the user in;
        call `POST /api/auth/login` next.
      security: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              email: Fay@Example.com
              password: Secret123!
              fullName: Fay Lin
      responses:
        '201':
          description: Account created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 6f1c2a9e-3b7d-4c55-9a10-2f4e8b6d0c31
                email: fay@example.com
                fullName: Fay Lin
                status: PENDING_VERIFICATION
                mfaEnabled: false
                createdAt: '2026-10-12T09:30:00.123456Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          description: |
            `EMAIL_ALREADY_REGISTERED`: an account with this email exists, in any letter case (AC-2.2, AC-1.7). Of
            several simultaneous registrations of one email, exactly one succeeds and every other one gets this code
            (AC-2.11).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Conflict
                status: 409
                detail: An account with this email already exists.
                instance: /api/auth/register
                code: EMAIL_ALREADY_REGISTERED
                requestId: rid-123
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        4XX:
          $ref: '#/components/responses/OtherClientError'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/auth/login:
    post:
      tags:
        - Accounts
      operationId: login
      summary: Log in and get an access token
      description: |
        Public. Returns an HS512 JWT valid for 24 hours (contract C2, AC-2.3). The email is matched case-insensitively
        (AC-2.5). A wrong password, an unknown email and a `SUSPENDED` account all get the same 401
        `INVALID_CREDENTIALS` body, so login doesn't reveal whether an email exists (AC-2.4, AC-2.6). An invalid or
        expired `Authorization` header on this request is ignored (AC-2.8).

        No account can have a password longer than 72 UTF-8 bytes (the BCrypt limit), so a longer login password is
        always 401 `INVALID_CREDENTIALS`, with the same `detail` and no validation error (AC-2.10).
      security: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: ana@example.com
              password: Secret123!
      responses:
        '200':
          description: Logged in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                accessToken: eyJhbGciOiJIUzUxMiJ9.eyJzdWIiOiI2ZjFjMmE5ZS0uLi4ifQ.signature
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: |
            `INVALID_CREDENTIALS`: wrong email or password (including any password over 72 UTF-8 bytes), or a
            suspended account. Same `detail` in every case.
          headers:
            WWW-Authenticate:
              $ref: '#/components/headers/WWWAuthenticate'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                detail: The email or password is incorrect.
                instance: /api/auth/login
                code: INVALID_CREDENTIALS
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        4XX:
          $ref: '#/components/responses/OtherClientError'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/auth/invitations/{token}/accept:
    post:
      tags:
        - Invitations
      operationId: acceptInvitation
      summary: Accept an invitation (new or existing account)
      description: |
        Public. Joins the invitation's organization with the invitation's role. The whole use case is one
        transaction: on any error no account and no membership are created (AC-6.8).

        **Anonymous caller (no account yet):** sends `password` and `fullName` (the same rules as registration). The
        account is created with the invitation's email and status `PENDING_VERIFICATION`, and joins the organization
        (`201`, AC-6.1). The response doesn't log the user in; call `POST /api/auth/login` next. If the invitation's
        email already has an account, the answer is 409 `EMAIL_ALREADY_REGISTERED` and the caller must log in first
        (AC-6.5). A missing or invalid body is 400 `VALIDATION_FAILED` (AC-6.6). No body, an empty body and `{}` give
        the same `errors`: one entry each for `fullName` and `password` (AC-6.10).

        **Authenticated caller (existing account):** sends a valid `Authorization: Bearer` token, normally with no
        body (`200`, AC-6.2). A well-formed JSON body is **ignored without validation**, because the caller's identity
        comes from the token (Q3); an unreadable body is still 400 `MALFORMED_REQUEST`. The invitation's email must
        equal the caller's email, case-insensitively, otherwise 403 `INVITATION_EMAIL_MISMATCH` and nothing changes
        (AC-6.3). An invalid or expired token is ignored and the caller is treated as anonymous (D7).

        **Response (Q2):** `200` and `201` have the same schema, `AcceptInvitationResponse`, and both `user` and
        `organization` are always present: the account and the organization it joined, with `myRole` set to the
        invitation's role.

        **Checks for both:** the token must exist (404 `INVITATION_NOT_FOUND`), and the invitation must be `PENDING`
        and unexpired (410 `INVITATION_EXPIRED`, `INVITATION_REVOKED` or `INVITATION_ALREADY_ACCEPTED`, AC-6.4). The
        caller must not already be a member (409 `ALREADY_MEMBER`, AC-6.7), and the organization must have a free
        seat: members < seat limit (409 `SEAT_LIMIT_REACHED`, AC-6.9). The token is never logged and never returned.

        **Single use (Q5):** the invitation's state is checked and claimed before any account or membership is
        written. Of two concurrent acceptances of one token, one succeeds and the other gets exactly what a second,
        sequential acceptance gets: 410 `INVITATION_ALREADY_ACCEPTED`, with no account and no membership created and
        never a 500.

        **Which error wins (Q6):** body validation, anonymous callers only (400 `VALIDATION_FAILED`); then 404
        `INVITATION_NOT_FOUND`; then 410 `INVITATION_ALREADY_ACCEPTED`, `INVITATION_REVOKED`, `INVITATION_EXPIRED`, in
        that order; then, for a logged-in caller, 403 `INVITATION_EMAIL_MISMATCH` and 409 `ALREADY_MEMBER`, or, for an
        anonymous caller, 409 `EMAIL_ALREADY_REGISTERED`; then 409 `SEAT_LIMIT_REACHED`.

        **`instance` holds the token:** on every error of this operation, the Problem's `instance` is the request path
        and so contains the acceptance token. It is the caller's own input, echoed only to that caller, and never
        logged (spec D13, Q3).

        Security: public (`security: []`), but an `Authorization: Bearer` token is read when present and valid, and
        it decides which of the two flows above applies.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          description: The acceptance token from the create-invitation response (32 URL-safe characters in phase 1).
          schema:
            type: string
          example: q3Xb0v6m1T2cJw8Hk4Zr9Ya5Lp7Nd0Es
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: false
        description: |
          Required for an anonymous caller. An authenticated caller normally omits it; if sent, a well-formed body is
          ignored without validation (Q3).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInvitationRequest'
            example:
              password: Secret123!
              fullName: Fay Lin
      responses:
        '200':
          description: An existing, logged-in account joined the organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptInvitationResponse'
              example:
                user:
                  id: 6f1c2a9e-3b7d-4c55-9a10-2f4e8b6d0c31
                  email: fay@example.com
                  fullName: Fay Lin
                  status: PENDING_VERIFICATION
                  mfaEnabled: false
                  createdAt: '2026-10-11T18:02:11.5Z'
                organization:
                  id: 0b8e4a52-6c1f-4f0e-8d3a-7a2b9c1d5e60
                  name: Acme QA
                  plan: FREE
                  seatLimit: 5
                  createdAt: '2026-10-01T08:00:00Z'
                  myRole: MEMBER
        '201':
          description: A new account was created and joined the organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptInvitationResponse'
              example:
                user:
                  id: 6f1c2a9e-3b7d-4c55-9a10-2f4e8b6d0c31
                  email: fay@example.com
                  fullName: Fay Lin
                  status: PENDING_VERIFICATION
                  mfaEnabled: false
                  createdAt: '2026-10-12T09:30:00.123456Z'
                organization:
                  id: 0b8e4a52-6c1f-4f0e-8d3a-7a2b9c1d5e60
                  name: Acme QA
                  plan: FREE
                  seatLimit: 5
                  createdAt: '2026-10-01T08:00:00Z'
                  myRole: MEMBER
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: '`INVITATION_EMAIL_MISMATCH`: the logged-in account''s email differs from the invitation''s (AC-6.3).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Forbidden
                status: 403
                detail: This invitation was sent to another email address.
                instance: /api/auth/invitations/q3Xb0v6m1T2cJw8Hk4Zr9Ya5Lp7Nd0Es/accept
                code: INVITATION_EMAIL_MISMATCH
        '404':
          description: '`INVITATION_NOT_FOUND`: no invitation has this token (AC-6.4).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          description: |
            One of:
            - `EMAIL_ALREADY_REGISTERED`: anonymous caller, but the invitation's email already has an account (AC-6.5),
              also when another request registers that email at the same moment (AC-2.11);
            - `ALREADY_MEMBER`: the account is already a member of the organization (AC-6.7);
            - `SEAT_LIMIT_REACHED`: the organization has no free seat (AC-6.9);
            - `CONFLICT`: another request changed the same data at the same time, or a lock couldn't be acquired in
              time (AC-1.9).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '410':
          description: |
            `INVITATION_EXPIRED`, `INVITATION_REVOKED` or `INVITATION_ALREADY_ACCEPTED` (AC-6.4, AC-5.9). The loser of
            two concurrent acceptances of the same token gets `INVITATION_ALREADY_ACCEPTED` (Q5).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Gone
                status: 410
                detail: This invitation has been revoked.
                instance: /api/auth/invitations/q3Xb0v6m1T2cJw8Hk4Zr9Ya5Lp7Nd0Es/accept
                code: INVITATION_REVOKED
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        4XX:
          $ref: '#/components/responses/OtherClientError'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/orgs:
