        new role must be within the cap of the target's organization role (422 `PROJECT_ROLE_NOT_ALLOWED`, AC-5.4).
        Setting the role a member already has is a successful no-op (AC-5.10). The change applies to the target's next
        request (AC-5.5). An archived project can't change (409 `PROJECT_ARCHIVED`, AC-3.6). `role` follows the same
        400 rules as in `addProjectMember`.

        **Which error wins (D6):** request validation (400); then 403 `FORBIDDEN` (no access; or, when the target isn't
        the caller, below effective `ADMIN`); then 409 `PROJECT_ARCHIVED`; then 404 `MEMBER_NOT_FOUND`; then 422
        `SELF_ROLE_CHANGE`; then 422 `PROJECT_ROLE_NOT_ALLOWED`. So an explicit member of any role who targets
        themselves gets `SELF_ROLE_CHANGE`.
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/XRequestId'
