    delete:
      tags:
        - Members
      operationId: removeMember
      summary: Remove a member, or leave
      description: |
        **Leave:** any member can remove themselves (`userId` = the caller's id), whatever their role (AC-8.3),
        except the last `OWNER` (409 `LAST_OWNER`, AC-8.4).

        **Remove someone else:** at least `ADMIN` (otherwise 403 `FORBIDDEN`), and the target's role must have a rank
        at most the caller's (otherwise 422 `ROLE_CEILING`, AC-8.1). The target must be a member (404
        `MEMBER_NOT_FOUND`, AC-8.5).

        A non-member caller gets 403 `FORBIDDEN`. Removal frees a seat (AC-8.6) and takes effect on the removed user's
        next request (AC-8.2). Two owners leaving at the same time can't leave the organization without an owner: one
        gets 409 `LAST_OWNER`.

        **Which error wins (Q6):** 403 `FORBIDDEN` (not a member; or, when the target isn't the caller, below
        `ADMIN`); then 404 `MEMBER_NOT_FOUND`; then 422 `ROLE_CEILING` (removing someone else); then 409 `LAST_OWNER`
        (leaving).
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '204':
          description: Removed (or left).
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/MemberNotFound'
        '409':
          description: |
            `LAST_OWNER`: the caller is the only `OWNER` and tried to leave; or `CONFLICT` when a lock couldn't be
            acquired in time (AC-1.9).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/RoleCeiling'
        4XX:
          $ref: '#/components/responses/OtherClientError'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/orgs/{orgId}/projects:
    post:
      tags:
