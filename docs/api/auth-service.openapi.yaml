  /api/orgs/{orgId}/members/{userId}:
    patch:
      tags:
        - Members
      operationId: changeMemberRole
      summary: Change a member's role
      description: |
        At least `ADMIN` (otherwise 403 `FORBIDDEN`), within the role ceiling: the target's current role and the new
        role must both have a rank at most the caller's (otherwise 422 `ROLE_CEILING`, AC-7.2). Nobody can change
        their own role (422 `SELF_ROLE_CHANGE`, AC-7.3); ownership is handed over by making someone else `OWNER`.
        The target must be a member (404 `MEMBER_NOT_FOUND`, AC-7.4). Setting the role a member already has is a
        successful no-op (AC-7.7). The change applies to the target's next request, whatever their token says (AC-7.6).
        An unknown `role` value is 400 `MALFORMED_REQUEST`; a missing `role` is 400 `VALIDATION_FAILED` (AC-7.5). A
        `role` sent as a number or a string of digits (`1`, `"2"`) is 400 `MALFORMED_REQUEST` and nothing changes
        (AC-7.8).

        **Which error wins (Q6):** request validation (400); then 403 `FORBIDDEN` (not a member; or, when the target
        isn't the caller, below `ADMIN`); then 404 `MEMBER_NOT_FOUND`; then 422 `SELF_ROLE_CHANGE`; then 422
        `ROLE_CEILING`. So a member of any role who targets themselves gets `SELF_ROLE_CHANGE`.
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeMemberRoleRequest'
            example:
              role: ADMIN
      responses:
        '200':
          description: The member with the new role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/MemberNotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          description: '`CONFLICT`: a lock couldn''t be acquired in time (AC-1.9).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: '`ROLE_CEILING` or `SELF_ROLE_CHANGE`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Unprocessable Content
                status: 422
                detail: You can't change your own role.
                instance: /api/orgs/0b8e4a52-6c1f-4f0e-8d3a-7a2b9c1d5e60/members/6a0e2b4c-8d1f-4e3a-9b5c-7d2e0f1a3b46
                code: SELF_ROLE_CHANGE
        4XX:
          $ref: '#/components/responses/OtherClientError'
