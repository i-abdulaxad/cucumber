        '403':
          $ref: '#/components/responses/ProjectForbidden'
        '404':
          $ref: '#/components/responses/FeatureNotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          description: |
            `PROJECT_ARCHIVED`: the project is archived (AC-7.7). `CONFLICT`: a lock couldn't be acquired in time.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                projectArchived:
                  $ref: '#/components/examples/ProjectArchived'
        4XX:
          $ref: '#/components/responses/OtherClientError'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/AccessCheckUnavailable'
