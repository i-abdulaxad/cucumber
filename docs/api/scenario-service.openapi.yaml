      operationId: getFeature
      summary: View a feature with its text and structure
      description: |
        Effective project role `READER` or higher (AC-2.3). Also allowed on an archived project and for an archived
        feature (AC-6.1).

        Returns the feature's metadata, the current version's `source` exactly as stored (AC-2.6), its Feature-level
        `tags`, and its structure (`children`) parsed from the current version (AC-1.2). Absent names and descriptions
        are `""`, an Examples block without a table has empty `header` and `rows` (AC-4.6), and each tag is listed
        once per element (AC-5.8). An unknown feature, or a feature of another project, is 404 `FEATURE_NOT_FOUND`
        (AC-2.4). The ids are matched exactly as received: leading or trailing whitespace is 400
        `MALFORMED_REQUEST` (AC-7.14). AC-8.7 observes this operation's logs.

        **Which error wins:** 401 `UNAUTHENTICATED`; 400 `MALFORMED_REQUEST` (AC-7.14); the access check (503, 401,
        403); 404 `FEATURE_NOT_FOUND`.
