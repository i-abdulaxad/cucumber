    put:
      tags:
        - Features
      operationId: saveFeature
      summary: Save a new version of a feature (and change its path)
      description: |
        Effective project role `MEMBER` or higher (otherwise 403 `FORBIDDEN`, AC-3.8). Not allowed on an archived
        project (409 `PROJECT_ARCHIVED`, AC-7.7) or for an archived feature (409 `FEATURE_ARCHIVED`, AC-6.2).

        The body carries the full new state: `source`, `path`, `baseVersion` and an optional `message` (D9).
        - `baseVersion` must be the current version; otherwise 409 `VERSION_CONFLICT` with `currentVersion`, and
          nothing changes (AC-3.5, AC-3.11). It must be a JSON integer from 1 to 2147483647; any other spelling is
          400 `MALFORMED_REQUEST` (AC-7.12).
        - `path`, `source` and `message` follow the same rules as on creation: no U+0000 or lone surrogate, no
          invisible path parts (400 `VALIDATION_FAILED`, AC-1.16); JSON strings only, so a number (including a
          fraction) or boolean is 400 `MALFORMED_REQUEST`, and `null` for `path` or `source` is 400
          `VALIDATION_FAILED` (AC-7.15).
        - A changed `source` must be valid Gherkin (422 `GHERKIN_INVALID`, nothing changes, AC-3.6; the "no Feature"
          entry only when the parser reports no error, AC-1.15; only UTF-8 encoding pragmas, AC-1.19) and have at
          most 10,000 elements (400 `VALIDATION_FAILED`, `source`, AC-1.20). It becomes the
          next version, by the caller, with `message` trimmed (AC-3.14), and the structure, tags and test cases
          follow it (AC-3.1, AC-4.4, AC-5.2). Scenario and example-row ids follow the stability rules (AC-3.2 to AC-3.4),
          matched on structured values, so names that contain separators never collide (AC-3.15).
        - A `source` identical to the current version's text, byte for byte, creates no version: `currentVersion` and
          `updatedAt` stay the same, and `message` isn't stored (AC-3.7).
        - A `path` different from the current one becomes the feature's path. It must be free among the project's
          other active features, ignoring letter case by ICU root lower case (409 `FEATURE_PATH_TAKEN`, AC-3.12,
          AC-1.17). A path change alone creates no version (AC-3.13).
        - The ids are matched exactly as received: leading or trailing whitespace is 400 `MALFORMED_REQUEST`
          (AC-7.14).

        `updatedAt` and `updatedBy` are changed by a new version, a path change (even without a new version), and a real
        archive or restore; unchanged by an identical save, archiving an archived feature, or restoring an active one.
        `createdAt` and `createdBy` never change (AC-3.13).

        Returns the feature as it is after the save (AC-3.1).

        **Which error wins:** 401 `UNAUTHENTICATED`; 400 `MALFORMED_REQUEST`, then 400 `VALIDATION_FAILED`; the access
        check (503, 401, 403); 409 `PROJECT_ARCHIVED`; 404 `FEATURE_NOT_FOUND`; 409 `FEATURE_ARCHIVED`; 409
        `VERSION_CONFLICT`; 422 `GHERKIN_INVALID`; 409 `FEATURE_PATH_TAKEN`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveFeatureRequest'
            example:
              path: features/checkout/payment.feature
              source: "@checkout\nFeature: Payment\n  Customers pay for their basket.\n\n  Background:\n    Given a basket with these items:\n      | item  | price |\n      | Mug   | 8.00  |\n      | Shirt | 20.00 |\n\n  @smoke\n  Scenario: Pay by card\n    When the customer pays by credit card\n    Then the receipt is:\n      \"\"\"text\n      Total: 28.00\n      \"\"\"\n\n  Scenario: Pay by bank transfer\n    When the customer pays by bank transfer\n    Then the order waits for payment\n\n  Rule: Vouchers\n\n    Scenario Outline: Pay with a voucher\n      When the customer pays with voucher \"<code>\"\n      Then the result is \"<result>\"\n\n      @regression\n      Examples: Valid vouchers\n        | code   | result    |\n        | SAVE10 | confirmed |\n        | SAVE20 | confirmed |\n\n      Examples: Expired vouchers\n        | code | result   |\n        | OLD5 | rejected |\n"
              baseVersion: 1
              message: Add bank transfer
      responses:
        '200':
          description: The feature after the save (with a new version, or unchanged text).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Feature'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ProjectForbidden'
        '404':
          $ref: '#/components/responses/FeatureNotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          description: |
            `PROJECT_ARCHIVED`: the project is archived (AC-7.7). `FEATURE_ARCHIVED`: the feature is archived; restore
            it first (AC-6.2). `VERSION_CONFLICT`: `baseVersion` isn't the current version; the Problem has
            `currentVersion` (AC-3.5, AC-3.11). `FEATURE_PATH_TAKEN`: another active feature has the new path,
            ignoring letter case by ICU root lower case (AC-3.12, AC-1.17). `CONFLICT`: a lock couldn't be acquired in
            time, or another unique conflict.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                projectArchived:
                  $ref: '#/components/examples/ProjectArchived'
                featureArchived:
                  value:
                    type: about:blank
                    title: Conflict
                    status: 409
                    detail: The feature is archived. Restore it first.
                    instance: /api/projects/3f9b2d6e-1c4a-4b7e-8f0d-5a2c4e6b8d13/features/7c1e9a40-2b5d-4f3a-9e8c-1d6b0a4f2e57
                    code: FEATURE_ARCHIVED
                    requestId: rid-123
                versionConflict:
                  value:
                    type: about:blank
                    title: Conflict
                    status: 409
                    detail: The feature has changed since version 1. Reload it and save again.
                    instance: /api/projects/3f9b2d6e-1c4a-4b7e-8f0d-5a2c4e6b8d13/features/7c1e9a40-2b5d-4f3a-9e8c-1d6b0a4f2e57
                    code: VERSION_CONFLICT
                    currentVersion: 2
                    requestId: rid-123
                featurePathTaken:
                  $ref: '#/components/examples/FeaturePathTaken'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/GherkinInvalid'
        4XX:
          $ref: '#/components/responses/OtherClientError'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/AccessCheckUnavailable'
