            `PROJECT_ARCHIVED`: the project is archived (AC-7.7). `FEATURE_PATH_TAKEN`: another active feature in the
            project has this path, ignoring letter case by ICU root lower case (AC-1.8, AC-1.10, AC-1.17); a path
            conflict is always this code, never `CONFLICT`. `CONFLICT`: a lock couldn't be acquired in time, or
            another unique conflict.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                projectArchived:
                  $ref: '#/components/examples/ProjectArchived'
                featurePathTaken:
                  $ref: '#/components/examples/FeaturePathTaken'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/GherkinInvalid'
        4XX:
          $ref: '#/components/responses/OtherClientError'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/AccessCheckUnavailable'
  /api/projects/{projectId}/features/{featureId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
