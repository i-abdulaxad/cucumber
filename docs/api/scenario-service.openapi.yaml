      operationId: getFeatureVersion
      summary: One version's text
      description: |
        Effective project role `READER` or higher (AC-3.9). Also allowed on an archived project and for an archived
        feature.

        Returns the version's metadata and its `source`, exactly as it was saved (AC-3.1). Only the text: the parsed
