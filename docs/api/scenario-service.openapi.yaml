        `updatedAt` and `updatedBy` are changed by a new version, a path change (even without a new version), and a
        real archive or restore; unchanged by an identical save, archiving an archived feature, or restoring an active
        one (AC-6.9). The ids are matched exactly as received: leading or trailing whitespace is 400
        `MALFORMED_REQUEST` (AC-7.14).

        **Which error wins:** 401 `UNAUTHENTICATED`; 400 `MALFORMED_REQUEST` (AC-7.14); the access check (503, 401,
        403); 409 `PROJECT_ARCHIVED`; 404 `FEATURE_NOT_FOUND` (AC-6.7); 409 `FEATURE_PATH_TAKEN`.
