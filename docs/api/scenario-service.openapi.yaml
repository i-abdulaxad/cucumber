    post:
      tags:
        - Features
      operationId: createFeature
      summary: Create a feature from Gherkin text
      description: |
        Effective project role `MEMBER` or higher (otherwise 403 `FORBIDDEN`, AC-1.3). Not allowed on an archived
        project (409 `PROJECT_ARCHIVED`, AC-7.7).

        Parses `source` (D8). Valid text creates the feature with version 1 (by the caller, with `message`), derives
        its name, description, language, tags and structure, and returns the full feature with `Location` (AC-1.1,
        AC-1.2). Invalid text is 422 `GHERKIN_INVALID` with `parseErrors`, and nothing is stored (AC-1.4,
        AC-1.13). The "no Feature" entry appears only when the parser reports no error; otherwise only the parser's
        errors are listed (AC-1.15). A `# encoding:` pragma other than UTF-8 is one parse error at 1:1 (AC-1.19). A
        valid text with more than 10,000 elements is 400 `VALIDATION_FAILED` (`source`), and nothing is stored
        (AC-1.20).

        The path follows the `FeaturePath` rules (400 `VALIDATION_FAILED`, AC-1.6, AC-1.14), including no invisible
        parts; no string field may contain U+0000 or a lone surrogate (AC-1.16). It must be free among the project's
        **active** features, ignoring letter case by ICU root lower case (409 `FEATURE_PATH_TAKEN`, AC-1.8,
        AC-1.17). The same path may exist in another project (AC-1.9) and on an archived feature (AC-6.4). Of several
        simultaneous creations with one path, exactly one succeeds and every other one gets 409
        `FEATURE_PATH_TAKEN` (AC-1.10).

        `path`, `source` and `message` must be JSON strings: a number (including a fraction) or boolean is 400
        `MALFORMED_REQUEST`, and `null` for `path` or `source` is 400 `VALIDATION_FAILED` (AC-7.15). The project id is matched exactly as
        received (AC-7.14). `createdAt`, `updatedAt` and version 1's `createdAt` are taken from the service clock, in
        UTC (AC-1.18).

        The US-8 logging ACs AC-8.1, AC-8.3, AC-8.5, AC-8.9 and AC-8.14 observe this operation; logging never changes
        its response.

        **Which error wins:** 401 `UNAUTHENTICATED`; 400 `MALFORMED_REQUEST`, then 400 `VALIDATION_FAILED`; the access
        check (503, 401, 403); 409 `PROJECT_ARCHIVED`; 422 `GHERKIN_INVALID`; 409 `FEATURE_PATH_TAKEN`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFeatureRequest'
            example:
              path: features/checkout/payment.feature
              source: |
                @checkout
                Feature: Payment
                  Customers pay for their basket.

                  Background:
                    Given a basket with these items:
                      | item  | price |
                      | Mug   | 8.00  |
                      | Shirt | 20.00 |

                  @smoke
                  Scenario: Pay by card
                    When the customer pays by card
                    Then the receipt is:
                      """text
                      Total: 28.00
                      """

                  Rule: Vouchers

                    Scenario Outline: Pay with a voucher
                      When the customer pays with voucher "<code>"
                      Then the result is "<result>"

                      @regression
                      Examples: Valid vouchers
                        | code   | result    |
                        | SAVE10 | confirmed |
                        | SAVE20 | confirmed |

                      Examples: Expired vouchers
                        | code | result   |
                        | OLD5 | rejected |
              message: First draft
