openapi: 3.1.0
info:
  title: scenario-service API
  version: 1.0.5
  summary: Gherkin features, their versions and parsed structure, derived test cases and tags, per project.
  description: |
    Contract C1 of `docs/specs/scenario-service.md` (phase 1). It documents every operation of decision D2, the
    request rules (D8–D13), the error format and order (D16), the access check (D3, D4) and the token rules (D6). The
    paths, status codes, `code` values and the Problem members `parseErrors` and `currentVersion` come from the
    spec's acceptance criteria (AC-x.y) and are binding. The wording of `detail`, of validation `message` texts and of
    parse error `message` texts is not part of the contract.

    ## Changes in 1.0.5 (`docs/specs/platform-hardening.md`, 2026-10-26)

    1.0.5: notes only; no path, schema, status or `code` changes.
    - Requests rejected before Spring MVC are Problems like every other error (D3, D5): paths the security firewall
      rejects (for example containing `;`, encoded `..` or `//`) are 400 `MALFORMED_REQUEST`, and `TRACE` is 405
      `METHOD_NOT_ALLOWED`, with `requestId`. `instance` is the path as sent, omitted when it isn't a valid URI
      reference. None of them calls the access check.
    - A direct `/error` is an unrouted path (D4): 401 `UNAUTHENTICATED` without a valid token, 404 `NOT_FOUND` with
      one. It never calls the access check.
    - The requests Tomcat rejects before the application are documented under "Requests rejected before the
      application" (D6).
    - Each access check is exactly one request on one connection, whatever the transport failure (SFU-1, D2); it
      still fails closed with 503 `ACCESS_CHECK_UNAVAILABLE`.

    ## Implementation status (1.0.5, 2026-10-26)

    The 1.0.5 behaviour is implemented (platform-hardening T3 and T4), pending qa verification.

    ## Changes in 1.0.4 (task T15c, 2026-10-19)

    1.0.4: fix round 1; only UTF-8 encoding pragmas; at most 10,000 elements per feature; no shape changes.
    - A `# encoding:` pragma that names any charset other than UTF-8 is 422 `GHERKIN_INVALID` with exactly one parse
      error at line 1, column 1: `Only UTF-8 encoding is supported` (AC-1.19; before, 500 or a wrongly decoded text).
    - A valid text with more than 10,000 elements is 400 `VALIDATION_FAILED` with an `errors` entry for `source`,
      checked at the new order step 7a (AC-1.20). The definition of an element is in `GherkinSource`.
    - Scenario and example-row ids are matched on structured values, so names containing separators can't collide
      (AC-3.15). No rule changes; the earlier implementation could give a 409 `CONFLICT` or keep a row id wrongly.
    - The access check forwards the caller's token as `Authorization: Bearer <token>` (the scheme normalised to
      `Bearer`), not the header exactly as sent.

    ## Changes in 1.0.3 (task T14, 2026-10-18)

    1.0.3: synced with the implementation (tasks T3–T13). No shape, path, status or code changes.
    - `VersionMessage`: trimming removes Unicode-blank characters as the spec's rule T2 defines them (Unicode
      whitespace, NBSP, U+200B–U+200D, U+2060, U+FEFF). NEL (U+0085) is not among them: it is a control character,
      so a message with a NEL, even at its end, is 400 `VALIDATION_FAILED` (review point A, pm decision 2026-10-18).
    - The gateway route of the spec's GE1 is in place (gateway contract 0.2.3). The gateway may reorder query
      parameters and percent-encode characters such as `@` (`tag=%40smoke`); the decoded values reach
      scenario-service unchanged.

    ## Changes in 1.0.2 (task T1c, 2026-10-18)

    1.0.2: D20 alignment with auth-service phase 4: ICU case-insensitive path comparison; invisible path parts
    rejected; ids, `{version}` and `archived` untrimmed; strict string types stated for every string field; 'no
    Feature' only without parser errors. No shape changes.
    - `path` uniqueness is compared by ICU root lower case, the same expression as the database's unique index, so
      `İzmir` collides with `i̇zmir` but not with `izmir` (AC-1.17).
    - `path` rejects a leading Unicode-blank character, and a segment or a file name made only of such characters;
      every string field rejects U+0000 and lone surrogates (AC-1.16).
    - Path ids, `{version}` and `archived` are matched exactly as received; leading or trailing whitespace is 400
      `MALFORMED_REQUEST` (AC-7.14).
    - A JSON number (including a fraction) or boolean for `path`, `source` or `message` is 400 `MALFORMED_REQUEST`;
      `null` stays a validation error (AC-7.15).
    - The "no Feature" parse error is reported only when the parser reports no error (AC-1.15).
    - Timestamps are taken from the service clock, in UTC (AC-1.18).
    - The US-8 logging ACs are now named on the operations they observe (AC-8.1 to AC-8.11, AC-8.14); logging never
      changes a response.

    ## Changes in 1.0.1 (task T1b, 2026-10-14)

    1.0.1: D19 clarifications; stricter `path`, `tag`, `{version}`, `archived` and `baseVersion`; no shape changes.
    - `path`: the suffix is exactly lower-case `.feature`, after at least one other character (AC-1.14).
    - `tag`: `@` plus at least one character, no whitespace or control character, at most 1,000 code points, given at
      most once (AC-5.7).
    - `{version}`, `archived` and `baseVersion` have one spelling each; any other is 400 `MALFORMED_REQUEST`
      (AC-7.12). `{version}` and `archived` are now described as strings with a pattern or enum.
    - Now stated: when `updatedAt` and `updatedBy` change (AC-3.13, AC-6.9); message trimming (AC-3.14); the
      "no Feature" parse error (AC-1.13); empty Examples blocks (AC-4.6); each tag listed once (AC-5.8); the tag
      filter on archived features (AC-6.10); the case-insensitive bearer scheme (AC-7.13).

    ## Implementation status (1.0.3, task T14, 2026-10-18)

    Every operation is implemented (spec tasks T3–T12) and routed through the gateway (T13). This file matches the
    implementation; the acceptance tests named by AC id in `scenario-service/src/test` cover each operation.

    ## Calling the service

    - **Through the gateway:** `http://localhost:8080` (normal use). The route `scenarios` (spec GE1, task T13)
      forwards `/api/projects/*/features`, `/api/projects/*/features/**` and `/api/projects/*/tags` to
      scenario-service. External paths equal service paths; the gateway doesn't rewrite paths, but it may reorder
      query parameters and percent-encode characters such as `@` (the decoded values are unchanged).
      - The gateway checks the token first. A missing or invalid token gets the **gateway's** 401 Problem, which has
        `requestId` but no `code`, and the request never reaches scenario-service.
      - Every other `/api/projects/**` path (for example `/api/projects/{projectId}` or `/api/projects/1`) isn't
        routed. With a token, it is the gateway's 404 Problem without `code` (AC-7.11).
      - The provisional placeholder `/api/scenarios/**` still routes here. scenario-service serves nothing there and
        answers 404 `NOT_FOUND` (spec D2).
      - The gateway's own errors (401, 403 for CORS, 404, 502, 503, 504) have no `code`. A gateway 503 means
        scenario-service itself couldn't be reached. scenario-service's own 503 always has the `code`
        `ACCESS_CHECK_UNAVAILABLE`.
    - **Directly:** `http://localhost:8082` (local development and tests only). scenario-service validates every
      token itself and never trusts identity headers (D6).
    - There is no runtime API document (no springdoc, spec D18). This file is the contract.

    ## Authentication (D6, C2)

    Every operation needs a valid bearer token. There is no public operation, and unknown paths need a token too.
    The token rules are under the security scheme `bearerAuth`; the scheme name `Bearer` is matched in any letter
    case (AC-7.13). A missing or invalid token is 401 `UNAUTHENTICATED`
    with `WWW-Authenticate: Bearer`, before any access check (AC-7.1).

    ## Authorization (D3, D4, D5)

    - Every request to a project-scoped path asks auth-service which role the caller has in the project: the access
      check C5 (`GET /internal/projects/{projectId}/access` on auth-service, contract 1.2.1). The caller's token is
      forwarded as `Authorization: Bearer <token>` (the token unchanged, the scheme normalised to `Bearer` whatever
      letter case the client sent), and so is the request ID (AC-7.2).
    - Roles are the caller's **effective** project roles, ranked `ADMIN` 4 > `MEMBER` 3 > `TESTER` 2 > `READER` 1.
      Organization `OWNER` and `ADMIN` are implicit project `ADMIN`. Each role includes the ones below it.
    - **No caching:** the role is checked on every request, so a removal or demotion applies to the next request
      (AC-7.5).

      | Operation | Minimum effective project role | On an archived project |
      |---|---|---|
      | List and view features; list versions and read one version; list test cases; tag catalogue | `READER` | Allowed |
      | Create a feature; save a new version or change the path; archive; restore | `MEMBER` | 409 `PROJECT_ARCHIVED` |

    - `TESTER` has the same rights as `READER` here. `ADMIN` has no extra rights in scenario-service.
    - No access, a role that is too low, and an unknown project all get the same 403 `FORBIDDEN`, so project ids
      can't be probed (AC-1.3, AC-2.1, AC-7.6).
    - The role is checked before the archive state: a `READER` writing to an archived project gets 403, not 409
      (AC-7.7).
    - A feature of another project is 404 `FEATURE_NOT_FOUND`, the same as an unknown feature (AC-2.4).

    ### When the access check fails (D4)

    | Answer of the access check | Answer of scenario-service |
    |---|---|
    | 200 with a known role, a boolean `archived`, and the requested `projectId` | Proceeds; the role is compared by rank |
    | 403 | 403 `FORBIDDEN` |
    | 401 (auth-service rejects the token, for example for a deleted or suspended user) | 401 `UNAUTHENTICATED` with `WWW-Authenticate: Bearer` (AC-7.4) |
    | No connection, a timeout, any 5xx, any other status, an unreadable body, an unknown role (for example `OWNER`), or another `projectId` | **503 `ACCESS_CHECK_UNAVAILABLE`** (AC-7.3) |

    The service **fails closed**: a 503 request changes nothing. The check has a 1 s connect timeout and a 2 s read
    timeout and is never retried, so the 503 comes within about 3 s (AC-7.3). The caller isn't denied: the platform
    is degraded, and clients may retry later.

    ## Gherkin text and parse errors (D7, D8)

    - A feature's content is its Gherkin text (`source`). The text is the source of truth. Everything else
      (name, description, language, tags, structure, test cases) is derived from it on every save.
    - **Valid Gherkin** means that the official Cucumber Gherkin parser reports no error **and** the text contains a
      `Feature`. Anything the parser accepts is accepted: an empty Feature name (`Feature:`), a Feature without
      scenarios, any Gherkin language (`# language: fr`), Rules (AC-1.11, AC-1.12).
    - Invalid text is 422 `GHERKIN_INVALID`, and **nothing is stored** (AC-1.4, AC-3.6). The Problem has the member
      `parseErrors`: one entry per error the parser reports, each with a 1-based `line` and `column` and the
      parser's `message`, sorted by line, then column (AC-1.5). A column the parser reports as 0 is reported as 1.
      **Only when the parser reports no error**, a text without a Feature (including whitespace-only or
      comment-only text) has exactly one entry: line 1, column 1, message `The text has no Feature` (AC-1.13). When
      the parser reports errors, only its errors are listed, never the "no Feature" entry: `Given a step` alone gives
      the parser's error at line 1, column 1 (AC-1.15). Field errors are never in `parseErrors`, and Gherkin errors
      are never in `errors`.
    - **Stored exactly as sent:** line endings, trailing spaces and a missing final newline come back byte for byte
      (AC-2.6).
    - Keywords are returned as written, without trailing whitespace (`Given`, `Soit`, `*`), together with their
      normalised type from the dialect (`GIVEN`, `WHEN`, `THEN`, `AND`, `BUT`, `ASTERISK`). Names and descriptions are
      returned as the parser reports them (a description keeps its indentation).
    - Only the **current version** has a structure. Older versions are available as text only.

    ## Versions and concurrent edits (D9)

    - Creating a feature makes version 1. Every save that changes the text makes the next version (2, 3, …).
      Versions are immutable and are never deleted.
    - **Optimistic concurrency:** a save names the version it was based on (`baseVersion`). If that isn't the current
      version, the save is 409 `VERSION_CONFLICT` with the member `currentVersion`, and nothing changes (AC-3.5). The
      client reloads, merges and saves again. Of several simultaneous saves on one version, exactly one succeeds and
      every other one gets `VERSION_CONFLICT`, never a 500 (AC-3.11).
    - **Unchanged text:** a save whose `source` is byte for byte the current version's text creates no version;
      `currentVersion` and `updatedAt` stay the same, and the answer is 200 (AC-3.7). `baseVersion` is still checked
      first.
    - A save may also change the path. A path change on its own creates no version (AC-3.12).
    - The base version is a body field, not an `If-Match` header (the gateway's CORS policy doesn't allow
      `If-Match`).

    ## Stable ids (C6, D9)

    report-service will store results against these ids, so their stability is part of the contract. Every schema
    property that holds an id says which kind it is, also in the extension `x-id-stability` (`stable` or
    `unstable`).

    | Id | Stability |
    |---|---|
    | Feature `id` | **Stable:** never changes, also through archive and restore. |
    | Scenario `id` (Background, Scenario, Scenario Outline) | **Stable while matched:** kept when the new version has an element of the same kind (Background; Scenario or Example; Scenario Outline or Scenario Template) with the same name in the same container (the Feature, or a Rule with the same name). With duplicate names, the n-th old element matches the n-th new one. Otherwise the element gets a new id, and old ids that match nothing disappear (AC-3.2, AC-3.3). |
    | Example row `id` | **Stable while matched:** kept when its outline keeps its id, the Examples block has the same header, and a row with identical cells exists in the old version (each old row matches at most one new row, in order). A changed row gets a new id (AC-3.4). |
    | Rule, Examples block and step `id` | **Unstable:** may change on every save. Clients must not keep them. |
    | Test case `id` | The scenario `id` (a Scenario) or the example row `id` (an Outline row), with their stability (AC-4.4). |

    All ids are kept through archive and restore (AC-6.5).

    ## Request rules (D8, D10, D12, D16; database pattern item 18)

    - **Ids in paths** (`projectId`, `featureId`) must be canonical UUIDs: 8-4-4-4-12 hexadecimal digits, in either
      letter case. They are normalised to lower case. Anything else is 400 `MALFORMED_REQUEST`, including forms
      Java's `UUID.fromString` would accept, such as `1-1-1-1-1` (AC-2.4, AC-7.6). A malformed project id is
      rejected before the access check.
    - **Matched exactly as received:** path ids, `{version}` and `archived` are never trimmed. Leading or trailing
      whitespace (for example `%20` or `%09`: `/api/projects/%20{projectId}/features`, `/versions/%201`,
      `archived=%20true`) is 400 `MALFORMED_REQUEST`, and no access check is made (AC-7.14).
    - **Lengths count Unicode code points**, not UTF-16 units or bytes.
    - **No string field** (`path`, `source`, `message`) may contain U+0000 or a lone surrogate (JSON can carry one
      only as an escape such as `"\ud800"`), because the database can't store them: 400 `VALIDATION_FAILED` with an
      `errors` entry for the field (AC-1.7, AC-1.16). `path` and `message` reject every control character too
      (U+0000–U+001F and U+007F–U+009F; for `message`, after trimming); `source` doesn't, because Gherkin files
      contain tabs and line breaks. `path` also rejects invisible parts (schema `FeaturePath`, AC-1.16).
    - **JSON types are strict:** a number or boolean where a string is expected (for example `"source": 123`) is 400
      `MALFORMED_REQUEST` (AC-7.9), as is an array or object. This holds for every string field: a JSON number
      (including a fraction such as `1.5`) or boolean for `path`, `source` or `message` is 400 `MALFORMED_REQUEST`
      (AC-7.15). A JSON `null` is not a type error: it counts as a missing value, so it is `VALIDATION_FAILED` for a
      required field (for example `"path": null`, AC-7.15) and means no message for `message`.
    - **One spelling per value:** `baseVersion` is a JSON integer from 1 to 2147483647; `{version}` matches
      `^[1-9][0-9]{0,9}$` and is at most 2147483647; `archived` is exactly `true` or `false`. Any other spelling is
      400 `MALFORMED_REQUEST` (AC-7.12), including the right value with leading or trailing whitespace (AC-7.14).
    - **Validation runs before the access check** (D16, as in auth-service). A caller without access who sends an
      invalid body gets 400; it reveals nothing about the project.

    ## Errors (D16)

    Every error scenario-service produces is an RFC 9457 Problem (`application/problem+json`, schema `Problem`) with
    `type` `about:blank`, `title` (the HTTP reason phrase), `status`, a non-empty `detail`, `instance` (the request
    path without the query string) and the stable extension member `code`. Clients branch on `status` first and on
    `code` second. When the request has an `X-Request-Id` header matching `^[A-Za-z0-9._-]{1,128}$` (the gateway
    always sends one), the body has `requestId` with that value. Bodies never contain stack traces, exception class
    names, SQL, hosts or ports (AC-7.9, AC-7.10).

    | Situation | Status | `code` | Extra member |
    |---|---|---|---|
    | Bean Validation failure on a body field or a query parameter; or a valid text with more than 10,000 elements (`errors` entry `source`, order step 7a, AC-1.20) | 400 | `VALIDATION_FAILED` | `errors` |
    | Unreadable JSON; a number, boolean, array or object where a string is expected, so a JSON number (including a fraction) or boolean for `path`, `source` or `message` (a JSON `null` is not a type error: `VALIDATION_FAILED` for `path` or `source`, no message for `message`; AC-7.15); a `baseVersion` that is a JSON string (`"1"`), a fraction (`1.5`, `1.0`) or above 2147483647; a malformed id in the path; a `{version}` with leading zeros, a sign, 0 or above 2147483647; an `archived` value other than `true` or `false`; a path id, `{version}` or `archived` with leading or trailing whitespace (for example `%20`, `%09`), since they are matched exactly as received (AC-7.14) | 400 | `MALFORMED_REQUEST` | — |
    | No or invalid token; or the access check answered 401 | 401 | `UNAUTHENTICATED` | — |
    | No access to the project, a role that is too low, or an unknown project | 403 | `FORBIDDEN` | — |
    | Unknown path | 404 | `NOT_FOUND` | — |
    | No such feature in this project (also a feature of another project) | 404 | `FEATURE_NOT_FOUND` | — |
    | No such version of the feature | 404 | `VERSION_NOT_FOUND` | — |
    | Method not supported on a known path | 405 | `METHOD_NOT_ALLOWED` | — |
    | No acceptable response media type for the `Accept` header | 406 | `NOT_ACCEPTABLE` | — |
    | Another active feature in the project has that path (ignoring letter case by ICU root lower case; schema `FeaturePath`) | 409 | `FEATURE_PATH_TAKEN` | — |
    | `baseVersion` isn't the current version | 409 | `VERSION_CONFLICT` | `currentVersion` |
    | Saving an archived feature | 409 | `FEATURE_ARCHIVED` | — |
    | A write on an archived project | 409 | `PROJECT_ARCHIVED` | — |
    | A lock that can't be acquired in time, a deadlock, or another unique-constraint conflict | 409 | `CONFLICT` | — |
    | Unsupported `Content-Type` | 415 | `UNSUPPORTED_MEDIA_TYPE` | — |
    | Any other 4xx that Spring MVC raises itself and that no row above covers (for example a missing required header) | Spring's status, unchanged | `MALFORMED_REQUEST` | — |
    | The text isn't valid Gherkin: the parser reports errors (only those are listed), or, only when it reports none, the text has no Feature (one entry: line 1, column 1, `The text has no Feature`; AC-1.13, AC-1.15); or a `# encoding:` pragma other than UTF-8 (one entry: line 1, column 1, `Only UTF-8 encoding is supported`; AC-1.19) | 422 | `GHERKIN_INVALID` | `parseErrors` |
    | Anything unexpected | 500 | `INTERNAL_ERROR` | — |
    | The access check couldn't be completed | 503 | `ACCESS_CHECK_UNAVAILABLE` | — |

    **Which error wins.** Checks run in this order, and the first failure is returned. Each operation's description
    lists the steps that apply to it.

    1. 401 `UNAUTHENTICATED` (the token, checked by the security filter).
    2. 400 `MALFORMED_REQUEST` (ids, unreadable JSON, wrong JSON types), then 400 `VALIDATION_FAILED` (body fields and
       query parameters).
    3. The access check: 503 `ACCESS_CHECK_UNAVAILABLE`, 401 `UNAUTHENTICATED` (answered by the access check), or 403
       `FORBIDDEN`.
    4. Writes: 409 `PROJECT_ARCHIVED`.
    5. 404 `FEATURE_NOT_FOUND`, then 404 `VERSION_NOT_FOUND`.
    6. Save: 409 `FEATURE_ARCHIVED`, then 409 `VERSION_CONFLICT`.
    7. Create and save: 422 `GHERKIN_INVALID`.
    7a. Create and save: 400 `VALIDATION_FAILED` (`errors` entry `source`) when a valid text has more than 10,000
        elements (AC-1.20). It needs the parse, so it comes after the access check and after parse errors, unlike the
        other 400s.
    8. Create, save with a new path, restore: 409 `FEATURE_PATH_TAKEN`.

    Notes:
    - Every 401 carries `WWW-Authenticate: Bearer`.
    - Unknown paths (404 `NOT_FOUND`, for example `/api/projects/{projectId}/unknown`) and unsupported methods on
      known paths (405 `METHOD_NOT_ALLOWED`, for example `DELETE /api/projects/{projectId}/features/{featureId}`)
      apply to every path and are not repeated per operation (AC-7.9). Like every path, they need a token first.
    - Any operation that writes can answer 409 `CONFLICT` under heavy contention. The request changes nothing, and
      clients may retry. Simultaneous creations with one path and simultaneous saves on one version get their own
      codes (`FEATURE_PATH_TAKEN`, `VERSION_CONFLICT`), not `CONFLICT` (AC-1.10, AC-3.11).
    - A 406 Problem is written as `application/problem+json` only when the request's `Accept` header allows that
      media type; otherwise the 406 body may be empty.

    ## Requests rejected before the application (platform-hardening D6)

    Tomcat rejects some requests before any application code runs: an encoded slash (`%2F`) or `%00` in the path,
    raw characters such as `{` or `|`, the `CONNECT` method (501), a malformed request line, and an oversized URI or
    headers. These keep Tomcat's status (400, or 501 for `CONNECT`) with Tomcat's minimal body: no Problem, no `code`,
    and nothing internal (no stack trace, no server version). They never reach the access check. This is permanent.
    Everything that reaches the application, including the security firewall's 400, `TRACE` and a direct `/error`, is
    a Problem as described above.

    ## Headers and other rules

    - `Location` headers are relative (`/api/projects/{projectId}/features/{featureId}`), with lower-case ids.
    - scenario-service never emits CORS headers (`Access-Control-*`) or an `X-Request-Id` response header. The
      gateway is the CORS authority.
    - Identity comes only from the token. An `X-User-Id` header from the client is ignored (AC-7.8).
    - Timestamps are UTC instants with a `Z` offset and at most microsecond precision, taken from the service clock
      (schema `Timestamp`, AC-1.18).
    - Operational logs (D17) never change a response. Every log line of a request carries its request ID (the valid
      `X-Request-Id`, otherwise a generated UUID) and the caller's user id, and no line contains Gherkin text, paths,
      names, tags, version messages, parse error messages, tokens or e-mail addresses. The US-8 ACs observe this
      through the operations named in their descriptions: AC-8.1, AC-8.2, AC-8.3, AC-8.4, AC-8.5, AC-8.6, AC-8.7,
      AC-8.8, AC-8.9, AC-8.10, AC-8.11, AC-8.14.
    - `createdBy` and `updatedBy` are auth-service user ids. scenario-service stores no names or emails; clients
      resolve names from auth-service.
    - Lists are not paginated in phase 1. Order: features by path lower-cased, in code-point order, then by id;
      versions newest first; tags by name in code-point (case-sensitive) order; structure and test cases in text
      order.
    - There is no hard delete. Features are archived instead.
  x-spec: docs/specs/scenario-service.md
servers:
  - url: http://localhost:8080
    description: Through the API gateway (normal use), once the gateway route of spec GE1 (task T13) is in place.
  - url: http://localhost:8082
    description: Direct to scenario-service (local development and tests).
security:
  - bearerAuth: []
tags:
  - name: Features
    description: Create, list, view, save, archive and restore features (US-1, US-2, US-3, US-6).
  - name: Versions
    description: A feature's immutable version history (US-3).
  - name: Test cases
    description: Test cases derived from the current version, as Cucumber would run them (US-4).
  - name: Tags
    description: The project's tag catalogue (US-5). The feature list's `tag` filter is under Features.
paths:
  /api/projects/{projectId}/features:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/XRequestId'
    get:
      tags:
        - Features
      operationId: listFeatures
      summary: List a project's features
      description: |
        Effective project role `READER` or higher (AC-2.1). Also allowed on an archived project (AC-7.7).

        Returns summaries without `source`, ordered by path lower-cased (code-point order), then by id (AC-2.2). Only
        the project's own features are listed (AC-2.5).
        - Without `archived`, or with `archived=false`: active features only.
        - With `archived=true`: archived features only (AC-6.1).
        - With `tag`: only the features (active, or archived with `archived=true`) whose current version uses the tag
          anywhere: on the Feature, a Rule, a Scenario or Scenario Outline, or an Examples block. Exact,
          case-sensitive match (AC-5.4, AC-6.3, AC-6.10). A malformed `tag` is 400 `VALIDATION_FAILED` (AC-5.7).

        An empty list is `[]`.

        The project id and `archived` are matched exactly as received: leading or trailing whitespace (`%20`, `%09`)
