spring:
  application:
    name: api-gateway
  autoconfigure:
    # D4: only bearer tokens authenticate. Without this, Boot creates an unused in-memory user and logs its password.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  mvc:
    formcontent:
      filter:
        # D2 (AC-1.7): form-encoded PUT, PATCH and DELETE bodies stay in the body. Spring's FormContentFilter would
        # parse them into request parameters, which the gateway then forwards in the query string.
        enabled: false
  http:
    clients:
      # D6: timeouts for every downstream call. Values come from the validated gateway.downstream settings below.
      connect-timeout: ${gateway.downstream.connect-timeout}
      read-timeout: ${gateway.downstream.response-timeout}
  cloud:
    gateway:
      server:
        webmvc:
          # D2: each prefix maps to exactly one service. The external path equals the downstream path
          # (no rewriting), there are no retries, and every URI is a static base URL (D3), never lb://.
          # metadata.service names the target service in the access log (D7).
          routes:
            - id: auth
              uri: ${gateway.downstream.auth-service-url}
              predicates:
                - Path=/api/auth/**
              metadata:
                service: auth-service
            - id: orgs
              uri: ${gateway.downstream.auth-service-url}
              predicates:
                - Path=/api/orgs,/api/orgs/**
              metadata:
                service: auth-service
            # scenario-service, decided in docs/specs/scenario-service.md D2; /api/scenarios/** is kept for existing tests.
            - id: scenarios
              uri: ${gateway.downstream.scenario-service-url}
              predicates:
                - Path=/api/scenarios/**,/api/projects/*/features,/api/projects/*/features/**,/api/projects/*/tags
              metadata:
                service: scenario-service
            # report-service, decided in docs/specs/report-service.md D3 (GW1); /api/reports/** is kept as scenarios kept
            # its placeholder. /api/ci/runs is the CI upload (public, GW2: authenticated by report-service's token).
            - id: reports
              uri: ${gateway.downstream.report-service-url}
              predicates:
                - Path=/api/reports/**,/api/projects/*/runs,/api/projects/*/runs/**,/api/projects/*/upload-tokens,/api/projects/*/upload-tokens/**,/api/ci/runs
              metadata:
                service: report-service

server:
  # D3: SERVER_PORT overrides this.
  port: 8080

management:
  endpoints:
    web:
      # D7: only GET /actuator/health is exposed. /actuator/gateway/** and every other endpoint stay unexposed,
      # and the /actuator links page is off.
      exposure:
        include: health
      discovery:
        enabled: false
  endpoint:
    health:
      # D7: {"status":"UP"} only. No details or components, and no downstream checks.
      show-details: never
      show-components: never
      # Kubernetes probe groups (/actuator/health/liveness, /readiness) are off until Helm wiring is specced.
      probes:
        enabled: false

logging:
  level:
    # D7: one entry per request from org.apigateway.filter.AccessLogFilter.
    org.apigateway.access: INFO
    # FU-2 (user 2026-11-02): at root DEBUG these log bodies, URLs with path secrets, headers or credentials.
    org.springframework.web.servlet.DispatcherServlet: INFO
    org.springframework.web.servlet.mvc.method.annotation.RequestResponseBodyMethodProcessor: INFO
    org.springframework.web.servlet.mvc.method.annotation.HttpEntityMethodProcessor: INFO
    org.springframework.security.web.FilterChainProxy: INFO
    # The JDK HTTP client forwards every request (D6); at DEBUG it logs each forwarded URL.
    jdk.internal.httpclient.debug: INFO

gateway:
  # D3: operator settings for locating services and bounding downstream calls.
  downstream:
    auth-service-url: ${AUTH_SERVICE_URL:http://localhost:8081}
    scenario-service-url: ${SCENARIO_SERVICE_URL:http://localhost:8082}
    report-service-url: ${REPORT_SERVICE_URL:http://localhost:8083}
    connect-timeout: ${GATEWAY_CONNECT_TIMEOUT:2s}
    response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:10s}
  security:
    # D2/D4: the only operations that need no token. Every other request needs a valid bearer token.
    # A new public endpoint needs a change here and a spec update.
    public-operations:
      - method: POST
        path: /api/auth/register
      - method: POST
        path: /api/auth/login
      - method: POST
        path: /api/auth/invitations/{token}/accept
      - method: GET
        path: /actuator/health
      # GW2 (report-service spec D3, D5): the CI upload carries an upload token, not a JWT; report-service checks it.
      - method: POST
        path: /api/ci/runs
  cors:
    # D5: exact origins only, comma-separated, no wildcards. Empty by default, so no cross-origin access.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: Authorization,Content-Type,Accept,X-Request-Id
    exposed-headers: X-Request-Id,Location
    max-age: 1800s

# D4: the shared HS512 secret binds to jwt.secret from the JWT_SECRET environment variable.
# It deliberately has no default here; only application-dev.yaml carries a DEV ONLY value.
