spring:
  application:
    name: auth-service
  jackson:
    datatype:
      enum:
        fail-on-numbers-for-enums: true
  mvc:
    log-resolved-exception: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  datasource:
    url: ${AUTH_DB_URL}
    username: ${AUTH_DB_USERNAME}
    password: ${AUTH_DB_PASSWORD}
    hikari:
      data-source-properties:
        # Every connection waits at most 5 s for a lock (PostgreSQL lock_timeout).
        options: "-c lock_timeout=5s"
        # Keeps PostgreSQL's error DETAIL, which can contain stored values, out of exception messages.
        logServerErrorDetail: false



server:
  port: 8081

logging:
  pattern:
    correlation: "[requestId=%X{requestId:--} userId=%X{userId:--}] "
  level:
    org.hibernate.orm.jdbc.error: ERROR

app:
  jwtSecret: ${JWT_SECRET}
  # Key of other services for /internal/service/** (C7, report-service spec D5); empty disables those paths (401).
  internal-service-key: ${INTERNAL_SERVICE_KEY:}
  jwtExpirationInMs: 86400000
  orgs:
    free-seat-limit: 5
  logging:
    enabled: true
    slow-call-threshold: 500ms

