spring:
  application:
    name: scenario-service
  mvc:
    log-resolved-exception: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        # Inserts of one write are sent as JDBC batches (D21 #2, SE10); with application-assigned ids nothing stops it
        jdbc:
          batch_size: 500
  datasource:
    url: ${SCENARIO_DB_URL}
    username: ${SCENARIO_DB_USERNAME}
    password: ${SCENARIO_DB_PASSWORD}
    hikari:
      data-source-properties:
        # Every connection waits at most 5 s for a lock (PostgreSQL lock_timeout), the project advisory lock included.
        options: "-c lock_timeout=5s"
        # Keeps PostgreSQL's error DETAIL, which can contain stored values, out of exception messages.
        logServerErrorDetail: false
        # The driver sends each batch of inserts as multi-row INSERT statements (D21 #2, SE10).
        reWriteBatchedInserts: true

server:
  port: 8082

logging:
  pattern:
    correlation: "[requestId=%X{requestId:--} userId=%X{userId:--}] "
  level:
    org.hibernate.orm.jdbc.error: ERROR
    org.hibernate.orm.core: INFO
    # FU-2 (user 2026-11-02): at root DEBUG these log bodies, URLs with path secrets, headers or credentials.
    org.springframework.web.servlet.DispatcherServlet: INFO
    org.springframework.web.servlet.mvc.method.annotation.RequestResponseBodyMethodProcessor: INFO
    org.springframework.web.servlet.mvc.method.annotation.HttpEntityMethodProcessor: INFO
    org.springframework.security.web.FilterChainProxy: INFO
    jdk.internal.httpclient.debug: INFO

app:
  jwtSecret: ${JWT_SECRET}
  auth-service:
    base-url: ${AUTH_SERVICE_URL:http://localhost:8081}
    connect-timeout: 1s
    read-timeout: 2s
  logging:
    enabled: true
    slow-call-threshold: 500ms
